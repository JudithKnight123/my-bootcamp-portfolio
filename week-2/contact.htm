<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <header>
        <img src="assets/images/JudithKnight_logo_digital_designer.jpg" alt="Judith Knight Logo" class="logo">
    </header>

    <!-- Navigation bar -->
      <nav class="navbar">
        <a href="index.htm" title="Home">Home</a>
        <a href="about.htm" title="About">About</a>
        <a href="services.htm" title="Services">Services</a>
        <a href="contact.htm" title="Contact">Contact</a>
    </nav>

    <!-- Content section with flexbox -->
    <main id="contact" class="container">
        <section class="content">

            <div class="col one text-left">
                 <div class="contact-form-container">
        <h1>Contact Me</h1>
       <form action="#" method="POST">
           

            <div class="form-group">
                <label for="name" class="name-label">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email" class="email-label">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit">Submit</button>
        </form>
     </div>
        </div>

     <div class="col two text-left">  
        <h2>Get in Touch</h2>
        <p>Have a question or want to work together? Fill out the form and I'll get back to you as soon as possible!</p>
       
        <p>Address: <br>
        123 Main Street, <br>
        Anytown, USA</p>
        <p><label for="phone">123-456-7890</label><br>
        <a href="mailto:judith@judithknight.co.uk" class="terms-link">or email me directly </a>
        </p>
   
     </div>
</section>

    </main>

     <footer>
        <p class="footer-copyright">©2026 <a href="https://judithknight.co.uk" rel="home">Judith Knight</a></p>
    </footer>
</body>

</html>
